# Build and test libc.a on every push to main. Each push updates the
# rolling `latest` prerelease in place, and a v* tag cuts an immutable
# versioned release from the same build. Everything runs as one bake graph
# inside the toolchain nix realizes from the devshell's own flake.lock, so
# CI's Clang/LLD are byte-for-byte the locally verified ones. Probes are
# compiled and their ELF contract
# checked, but never executed: the runner kernel is not the pinned 7.2, and
# behaviour is checked in-VM.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['.scratch/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libuc:
    runs-on: ubuntu-latest
    # A superseded build is cancelled here and its dependent jobs skipped.
    # Run-level cancellation would also kill a `latest` job mid-update.
    concurrency:
      group: ci-libuc-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # The default docker driver cannot export layer cache, hence the
      # container-driver builder.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          source: .
          provenance: false
          files: |
            docker-bake.hcl
            docker-bake.gha-cache.hcl
          targets: libuc

      - uses: actions/upload-artifact@v7
        with:
          name: libuc
          path: out/libuc/*/*.tar.gz

  # Never cancelled mid-update: a superseding push queues behind the group,
  # so the tag and the assets it floats with cannot be left torn.
  latest:
    needs: libuc
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ci-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      - name: Stage assets
        run: (cd dist && mv -- */*.tar.gz . && rmdir -- */ && sha256sum -- * > SHA256SUMS)

      # gh cannot move an existing tag; this push is the whole trick.
      - name: Float the latest tag to head
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest"

      # gh has no upsert; edit in place, falling back to the first-run create.
      - name: Refresh the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Rolling build of main at ${GITHUB_SHA}. \
          For stable checksums use a versioned release."
          gh release edit latest --prerelease --notes "$notes" ||
            gh release create latest --prerelease --notes "$notes"
          gh release upload latest dist/* --clobber

  release:
    needs: libuc
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      - name: Stage assets
        run: (cd dist && mv -- */*.tar.gz . && rmdir -- */ && sha256sum -- * > SHA256SUMS)

      # No checkout in this job, so name the repo for gh explicitly.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes
          "include/ and lib/libc.a per architecture, plain -O2, Clang/LLD
          pinned by the repo's flake.lock."
