# Build and test libc.a on every push to main — the tarballs land as the
# `libuc` workflow artifact — and cut an immutable release from the same
# build when a v* tag is pushed. Everything runs as one bake graph inside the
# digest-pinned alpine toolchain, so CI's Clang/LLD are the versions
# AGENTS.md records as verified. Probes are compiled and their ELF contract
# checked, but never executed: the runner kernel is not the pinned 7.2, and
# behaviour is checked in-VM.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['.scratch/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libuc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default docker driver cannot export layer cache, hence the
      # container-driver builder.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          source: .
          provenance: false
          files: |
            docker-bake.hcl
            docker-bake.gha-cache.hcl
          targets: libuc

      - uses: actions/upload-artifact@v7
        with:
          name: libuc
          path: out/libuc/*/*.tar.gz

  release:
    needs: libuc
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && mv -- */*.tar.gz . && rmdir -- */ && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "include/ and lib/libc.a per architecture, plain -O2, Clang/LLD from the digest-pinned Alpine."
