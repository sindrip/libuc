# Build and test libc.a on every push to main. Each push updates the
# rolling `latest` prerelease in place, and a v* tag cuts an immutable
# versioned release from the same build. Everything runs as one bake graph inside the
# digest-pinned alpine toolchain, so CI's Clang/LLD are the versions
# AGENTS.md records as verified. Probes are compiled and their ELF contract
# checked, but never executed: the runner kernel is not the pinned 7.2, and
# behaviour is checked in-VM.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['.scratch/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libuc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default docker driver cannot export layer cache, hence the
      # container-driver builder.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          source: .
          provenance: false
          files: |
            docker-bake.hcl
            docker-bake.gha-cache.hcl
          targets: libuc

      - uses: actions/upload-artifact@v7
        with:
          name: libuc
          path: out/libuc/*/*.tar.gz

  # Never cancelled mid-update: a superseding push queues behind the group,
  # so the tag and the assets it floats with cannot be left torn.
  latest:
    needs: libuc
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ci-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      - name: Stage assets
        run: (cd dist && mv -- */*.tar.gz . && rmdir -- */ && sha256sum -- * > SHA256SUMS)

      # No action moves an existing tag; this line is the whole trick.
      - name: Float the latest tag to head
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: true
          fail_on_unmatched_files: true
          body: >-
            Rolling build of main at ${{ github.sha }}. For stable checksums
            use a versioned release.
          files: dist/*

  release:
    needs: libuc
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      - name: Stage assets
        run: (cd dist && mv -- */*.tar.gz . && rmdir -- */ && sha256sum -- * > SHA256SUMS)

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: >-
            include/ and lib/libc.a per architecture, plain -O2, Clang/LLD
            from the digest-pinned Alpine.
          files: dist/*
