# Build and test libc.a on every push to main. Each push updates the
# rolling `latest` prerelease in place, and a v* tag cuts an immutable
# versioned release from the same build. Everything runs as one bake graph
# inside the toolchain nix realizes from the devshell's own flake.lock, so
# CI's Clang/LLD are byte-for-byte the locally verified ones. Probes are
# compiled and their ELF contract
# checked, but never executed: the runner kernel is not the pinned 7.2, and
# behaviour is checked in-VM.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['.scratch/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libuc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    # A superseded build is cancelled here and its dependent jobs skipped.
    # Run-level cancellation would also kill a `latest` job mid-update.
    concurrency:
      group: ci-libuc-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      # The default docker driver cannot export layer cache, hence the
      # container-driver builder.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          source: .
          provenance: false
          files: |
            docker-bake.hcl
            docker-bake.gha-cache.hcl
          targets: libuc

      # Staged once here, in release shape: both publish jobs upload
      # dist/ exactly as downloaded.
      - name: Stage assets
        run: mkdir dist && mv -- out/libuc/*/*.tar.gz dist/ && (cd dist && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: libuc
          path: dist

      # Signed provenance linking each asset to this workflow, commit, and
      # toolchain; consumers check it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Summarize artifacts
        run: |
          {
            echo '| asset | bytes | sha256 |'
            echo '| --- | --- | --- |'
            while read -r sha name; do
              echo "| $name | $(stat -c %s "dist/$name") | $sha |"
            done < dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

  # Never cancelled mid-update: a superseding push queues behind the group,
  # so the tag and the assets it floats with cannot be left torn.
  latest:
    needs: libuc
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ci-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      # gh cannot move an existing tag; this push is the whole trick.
      - name: Float the latest tag to head
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest"

      # gh has no upsert; edit in place, falling back to the first-run create.
      - name: Refresh the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Rolling build of main at ${GITHUB_SHA}. \
          For stable checksums use a versioned release."
          gh release edit latest --prerelease --notes "$notes" ||
            gh release create latest --prerelease --notes "$notes"
          gh release upload latest dist/* --clobber

  release:
    needs: libuc
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libuc
          path: dist

      # No checkout in this job, so name the repo for gh explicitly.
      # Assets upload only after the release exists, so a plain create is
      # briefly visible empty; stay draft until they land, then the flip to
      # published is atomic.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="include/ and lib/libc.a per architecture, plain -O2, \
          Clang/LLD pinned by the repo's flake.lock. Provenance: \
          gh attestation verify <asset> --repo ${GITHUB_REPOSITORY}"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --notes "$notes"
          gh release edit "$GITHUB_REF_NAME" --draft=false
