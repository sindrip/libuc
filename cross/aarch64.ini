[binaries]
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
c_ld = 'lld'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
skip_sanity_check = true
uapi_include = '@GLOBAL_SOURCE_ROOT@/out/uapi/linux_arm64/include'

[built-in options]
c_args = ['--target=aarch64-unknown-linux-gnu']
c_link_args = ['--target=aarch64-unknown-linux-gnu']
